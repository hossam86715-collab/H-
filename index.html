<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اللغة السرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050806;
  --forest:#0b2a1c;
  --emerald:#14543a;
  --gold:#d4af37;
  --gold-soft:#f0d98a;
  --text:#ecebe3;
  --muted:#9fb3a7;
  --gold-grad:linear-gradient(135deg,#f6e3a1 0%,#d4af37 45%,#a8841f 100%);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(20,84,58,.55),transparent 60%),
    radial-gradient(700px 500px at 0% 100%,rgba(212,175,55,.10),transparent 60%),
    var(--ink);
  padding:28px 16px 40px;
  display:flex;justify-content:center;
}
main{width:100%;max-width:680px}
header{text-align:center;margin:18px 0 28px}
.sigil{
  font-family:'Noto Sans Runic','Segoe UI Historic','Apple Symbols',serif;
  font-size:1.5rem;letter-spacing:.5em;color:var(--gold);opacity:.85;
  margin-bottom:10px;padding-inline-start:.5em;
}
h1{
  font-family:'Reem Kufi','Cairo',sans-serif;font-weight:700;
  font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.2;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
header p{color:var(--muted);margin-top:8px;font-size:1rem}
.card{
  position:relative;border-radius:22px;padding:22px;
  background:linear-gradient(160deg,rgba(14,48,34,.85),rgba(5,8,6,.92));
  border:1px solid rgba(212,175,55,.35);
  box-shadow:0 0 0 4px rgba(5,8,6,.9),0 0 0 5px rgba(212,175,55,.18),0 30px 60px rgba(0,0,0,.55);
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid rgba(212,175,55,.2);margin-bottom:20px}
.tab{
  font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;
  padding:12px;border-radius:10px;border:0;background:transparent;color:var(--muted);
  transition:background .25s,color .25s;
}
.tab[aria-selected="true"]{background:var(--gold-grad);color:#1a1405}
.tab:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
label{display:block;color:var(--gold-soft);font-size:.95rem;margin:0 0 8px}
textarea,input{
  width:100%;font:inherit;color:var(--text);
  background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:14px;
  transition:border-color .2s;
}
textarea{min-height:130px;resize:vertical;line-height:1.7}
textarea:focus,input:focus{border-color:var(--gold)}
textarea::placeholder,input::placeholder{color:#6b8174}
.out{
  min-height:130px;border-radius:14px;padding:14px;line-height:2;word-break:break-all;
  background:rgba(212,175,55,.06);border:1px dashed rgba(212,175,55,.45);
  font-size:1.25rem;white-space:pre-wrap;
}
.out.runes{font-family:'Noto Sans Runic','Segoe UI Historic','Apple Symbols','Noto Sans Symbols',serif;color:var(--gold-soft);letter-spacing:.12em;direction:ltr;text-align:left}
.out.plain{color:var(--text);font-size:1.3rem}
.out:empty::before{content:attr(data-empty);color:#6b8174;font-size:1rem;font-family:'Cairo',sans-serif;letter-spacing:0}
.field{margin-bottom:18px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{
  flex:1;font:inherit;font-weight:600;cursor:pointer;border-radius:12px;padding:13px 16px;
  border:1px solid rgba(212,175,55,.5);background:transparent;color:var(--gold-soft);
  transition:transform .15s,background .2s;
}
.btn:hover{background:rgba(212,175,55,.12)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--gold-grad);color:#1a1405;border-color:transparent}
.btn.main:hover{filter:brightness(1.08)}
[hidden]{display:none!important}
.toast{
  position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--gold-grad);color:#1a1405;font-weight:600;padding:11px 22px;border-radius:999px;
  transition:opacity .25s,transform .25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
footer{text-align:center;color:#5f7468;font-size:.85rem;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="sigil" aria-hidden="true">ᚠᚢᚦᚨᚱᚲ</div>
    <h1>اللغة السرية</h1>
    <p>حوّل كلامك لرموز، وافهم الرموز اللي توصلك.</p>
  </header>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-send" aria-selected="true" aria-controls="p-send">إرسال</button>
      <button class="tab" role="tab" id="t-recv" aria-selected="false" aria-controls="p-recv">استلام</button>
    </div>

    <div class="field">
      <label for="key">مفتاح سري (اختياري)</label>
      <input id="key" type="text" autocomplete="off" placeholder="اكتب نفس المفتاح عند المرسل والمستلم">
      <p class="hint">بدون مفتاح، أي حد عنده الموقع يقدر يفك الرموز.</p>
    </div>

    <div id="p-send" role="tabpanel" aria-labelledby="t-send">
      <div class="field">
        <label for="plain">اكتب رسالتك</label>
        <textarea id="plain" placeholder="اكتب هنا بالعربي..."></textarea>
      </div>
      <label>الرموز</label>
      <div id="encoded" class="out runes" data-empty="الرموز هتظهر هنا" aria-live="polite"></div>
      <div class="row">
        <button class="btn main" id="copy">نسخ الرموز</button>
        <button class="btn" id="clear1">مسح</button>
      </div>
    </div>

    <div id="p-recv" role="tabpanel" aria-labelledby="t-recv" hidden>
      <div class="field">
        <label for="code">الصق الرموز</label>
        <textarea id="code" class="runes-in" placeholder="الصق الرموز اللي وصلتك هنا..."></textarea>
      </div>
      <label>المعنى</label>
      <div id="decoded" class="out plain" data-empty="المعنى هيظهر هنا" aria-live="polite"></div>
      <div class="row">
        <button class="btn main" id="paste">لصق من الحافظة</button>
        <button class="btn" id="clear2">مسح</button>
      </div>
    </div>
  </section>

  <footer>رسائلك بتتحول جوه جهازك فقط، ومفيش حاجة بتتبعت لأي سيرفر.</footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const LETTERS = "ابتثجحخدذرزسشصضطظعغفقكلمنهويءةىأإآؤئ".split("");
const BASE = LETTERS.map((_, i) => String.fromCodePoint(0x16A0 + i));

function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s){
  let h = 2166136261;
  for (const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function buildMaps(key){
  const syms = BASE.slice();
  const k = key.trim();
  if (k){
    const r = rng(hash(k));
    for (let i = syms.length - 1; i > 0; i--){
      const j = Math.floor(r() * (i + 1));
      [syms[i], syms[j]] = [syms[j], syms[i]];
    }
  }
  const enc = {}, dec = {};
  LETTERS.forEach((l, i) => { enc[l] = syms[i]; dec[syms[i]] = l; });
  return { enc, dec };
}
const encode = (text, key) => { const m = buildMaps(key).enc; return [...text].map(c => m[c] ?? c).join(""); };
const decode = (text, key) => { const m = buildMaps(key).dec; return [...text].map(c => m[c] ?? c).join(""); };

const $ = id => document.getElementById(id);
const keyEl = $("key"), plain = $("plain"), encoded = $("encoded"), code = $("code"), decoded = $("decoded");

function refresh(){
  encoded.textContent = encode(plain.value, keyEl.value);
  decoded.textContent = decode(code.value, keyEl.value);
}
[keyEl, plain, code].forEach(e => e.addEventListener("input", refresh));

function setTab(send){
  $("t-send").setAttribute("aria-selected", send);
  $("t-recv").setAttribute("aria-selected", !send);
  $("p-send").hidden = !send;
  $("p-recv").hidden = send;
}
$("t-send").onclick = () => setTab(true);
$("t-recv").onclick = () => setTab(false);

let timer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(timer); timer = setTimeout(() => t.classList.remove("show"), 1800);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove(); return ok;
  }
}
$("copy").onclick = async () => {
  const v = encoded.textContent;
  if (!v){ toast("اكتب رسالة الأول"); return; }
  toast(await copyText(v) ? "تم نسخ الرموز" : "تعذر النسخ، انسخها يدويًا");
};
$("paste").onclick = async () => {
  try { code.value = await navigator.clipboard.readText(); refresh(); }
  catch(e){ toast("الصق الرموز يدويًا في الخانة"); code.focus(); }
};
$("clear1").onclick = () => { plain.value = ""; refresh(); plain.focus(); };
$("clear2").onclick = () => { code.value = ""; refresh(); code.focus(); };
</script>
</body>
</html>
